[project]
name = "volt-returns"
version = "0.1.0"
description = "Агент обработки возвратов для магазина Вольт"
requires-python = ">=3.10,<3.11"
dependencies = [
    "filelock>=3.16,<4",
    "httpx>=0.27,<0.29",
    "natasha==1.6.0",
    "numpy>=1.24,<2",
    "pydantic>=2.10,<3",
    "setuptools==75.9.1",  # pymorphy2 loads its Russian dictionary via pkg_resources.
]

[tool.uv]
package = false
